# MediCitas completo con un solo comando:  cp .env.example .env  &&  docker compose up -d --build
#
# Orden de arranque (lo controla depends_on):
#   db  →  migraciones (aplica el esquema y termina)  →  agenda, plataforma, auditoria  →  web
# Solo `web` publica un puerto. Las APIs y la base quedan en la red interna del compose; el navegador llega a
# las APIs a través de web, en /api/<servicio>/.
name: medicitas

# Lo que comparten los tres servicios de Python. `<<: *api` copia este bloque en cada uno.
x-api: &api
  restart: unless-stopped
  environment:
    # Hoy los tres usan el mismo usuario de la base. Cuando existan los roles de menor privilegio (T19),
    # cada servicio recibe aquí el suyo y el código no cambia.
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # "desarrollo": la identidad llega en la cabecera X-Usuario-Id, SIN validar. Solo mientras no exista Keycloak
    # (T17 y T18). Con otro valor, los servicios rechazan toda solicitud con 401. Ver comun/medicitas_comun/sesion.py.
    AUTH_MODO: ${AUTH_MODO:-desarrollo}
  depends_on:
    migraciones:
      condition: service_completed_successfully
  deploy:
    resources:
      limits:
        memory: 256M

services:

  db:
    image: postgres:16.15   # versión exacta: todos prueban sobre el mismo motor
    restart: unless-stopped
    environment:
      # ":?" detiene el compose con un mensaje claro si falta la variable en .env
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
    volumes:
      # Volumen nombrado: los datos sobreviven a `docker compose down` (no a `down -v`).
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Trabajo de una sola vez: aplica las migraciones nuevas (y la semilla si CARGAR_SEMILLA=si) y termina.
  # Si una falla, termina con error y las APIs no arrancan sobre un esquema incompleto.
  migraciones:
    image: postgres:16.15   # solo se usa su psql
    command: ["sh", "/db/aplicar.sh"]
    restart: "no"
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      CARGAR_SEMILLA: ${CARGAR_SEMILLA:-si}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy

  # Identidad delegada (RF17, núcleo "Identidad delegada"). Realm, roles, clients y usuarios de prueba se
  # importan de keycloak/realm-export.json al arrancar: nada se configura a mano por consola. Sin volumen de
  # datos a propósito: cada `docker compose up` reimporta el mismo realm, así que los usuarios de prueba
  # (y sus contraseñas) son siempre los mismos, en cualquier computadora.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?falta KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      # Solo para abrir la consola de administración del realm en el navegador (usuario KEYCLOAK_ADMIN);
      # los tres servicios de Python llegan a Keycloak por la red interna, no por este puerto.
      - "${PUERTO_KEYCLOAK:-8081}:8080"
    healthcheck:
      # La imagen no trae curl ni wget. /dev/tcp (bashismo) abre el socket a mano contra el puerto de
      # administración (KC_HEALTH_ENABLED) y lee la respuesta de /health/ready.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # Persona A: horarios, bloqueos, disponibilidad y ciclo de vida de la cita (RF5–RF13, RF20).
  agenda:
    <<: *api
    build: { context: ./servicios, args: { SERVICIO: agenda } }

  # Pruebas del servicio de agenda contra la base real (cada prueba se deshace con ROLLBACK):
  #   docker compose --profile pruebas run --rm pruebas-agenda
  pruebas-agenda:
    build: { context: ./servicios, target: pruebas, args: { SERVICIO: agenda } }
    profiles: [pruebas]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_MODO: desarrollo
    depends_on:
      migraciones:
        condition: service_completed_successfully

  # Persona B: clínicas, usuarios, catálogo, profesionales, pacientes y notas (RF1–RF4, RF14–RF16).
  plataforma:
    <<: *api
    build: { context: ./servicios, args: { SERVICIO: plataforma } }

  # Consulta de la bitácora y reportes (RF19, RF21). Solo lee.
  auditoria:
    <<: *api
    build: { context: ./servicios, args: { SERVICIO: auditoria } }

  # Frontend compilado + gateway hacia las APIs. No espera a las APIs: si una cae, el resto sigue sirviendo.
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-8080}:80"
    deploy:
      resources:
        limits:
          memory: 64M

  # Opcional, solo para desarrollo:  docker compose --profile herramientas up -d
  pgadmin:
    image: dpage/pgadmin4:9.10
    profiles: [herramientas]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@medicitas.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-cambiar-esto}
    ports:
      - "127.0.0.1:5050:80"   # solo desde esta computadora
    volumes:
      - datos_pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
  datos_pgadmin:
