# Sirve el frontend y reparte /api/<servicio>/ hacia cada API. El navegador ve un solo origen: sin CORS,
# y las APIs no publican puertos propios.
server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker. Con el destino en una variable, nginx resuelve el nombre en cada solicitud:
    # arranca aunque una API esté caída, y si una cae, solo sus rutas responden 502; el resto sigue.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /salud {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/api/(agenda|plataforma|auditoria)/ {
        set $servicio $1;
        # Quita el prefijo con rewrite, que vuelve a codificar la ruta. Armar la URL a mano con una captura le pasaría
        # a la API la ruta ya decodificada, con espacios o saltos de línea que un cliente haya escrito como %20 o %0d.
        rewrite ^/api/[^/]+/(.*)$ /$1 break;
        proxy_pass http://$servicio:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;   # el mismo id aparece en los logs de nginx y de la API
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # Keycloak (RF17): login del frontend (authorization code + PKCE) y endpoint de token para pruebas y
    # la colección de peticiones. Mismo origen que el resto, así que tampoco necesita CORS.
    # Destino en una variable, igual que /api/: nginx lo resuelve en cada solicitud y no se niega a
    # arrancar si Keycloak (que tarda más que las APIs en levantar) todavía no responde.
    location /auth/ {
        set $keycloak keycloak;   # antes del rewrite: `break` detiene también los `set` que vengan después
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://$keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # Vite pone un hash en el nombre de cada archivo de assets/: se pueden guardar en caché para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca se guarda en caché, para que un despliegue nuevo se vea al recargar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
