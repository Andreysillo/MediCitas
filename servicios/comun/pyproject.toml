# Infraestructura compartida por los tres servicios: arranque, conexión a la base, salud, errores y logs.
# Aquí NO va lógica de negocio: cada regla vive en el servicio dueño del requisito.
[project]
name = "medicitas-comun"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.7",
    "psycopg-pool==3.3.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
